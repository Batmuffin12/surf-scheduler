openapi: 3.0.3
info:
  title: Surf Scheduler API
  version: 0.1.0
  description: |
    A user signs up with just an email (no password), then can view the application.
servers:
  - url: http://localhost:3000

paths:
  /users:
    post:
      operationId: createUser
      summary: Create a user from an email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing or malformed email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A user with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      operationId: findUserByEmail
      summary: Sign in; look up a user by email (trimmed, case-insensitive)
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: The user, same object as createUser returns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing or malformed email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user with this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}:
    get:
      operationId: getUser
      summary: View a user, which gives access to the application
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: MongoDB ObjectId as a 24-character hex string
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}/profile:
    put:
      operationId: saveProfile
      summary: Save the user's surf profile (replaces the whole profile)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: MongoDB ObjectId as a 24-character hex string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Profile"
      responses:
        "200":
          description: The user with the saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >
            Invalid profile. The message names the broken rule: unknown surfType; city without name,
            latitude and longitude; maxRadiusKm outside 0 to 100; schedule not exactly one entry per weekday;
            a working day whose start or end is not a whole hour, whose end is not after its start
            (no block crosses midnight), or whose flexHours is not a whole number from 0 to 3;
            a day off that carries times.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Profile:
      type: object
      required: [surfType, city, maxRadiusKm, schedule]
      properties:
        surfType:
          type: string
          enum: [SUP, WAVE, BOTH]
        city:
          $ref: "#/components/schemas/City"
        maxRadiusKm:
          type: number
          minimum: 0
          maximum: 100
        schedule:
          type: array
          description: Exactly seven entries, one per weekday, in any order
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/ScheduleEntry"
    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: surfer@example.com
    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          description: MongoDB ObjectId as a 24-character hex string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        surfType:
          type: string
          enum: [SUP, WAVE, BOTH]
        city:
          $ref: "#/components/schemas/City"
        maxRadiusKm:
          type: number
          minimum: 0
          maximum: 100
          description: Maximum distance from the city to a candidate beach
        schedule:
          type: array
          description: One entry per weekday
          items:
            $ref: "#/components/schemas/ScheduleEntry"
    City:
      type: object
      description: The user's chosen city; the anchor point for the radius
      required: [name, latitude, longitude]
      properties:
        name:
          type: string
          example: Tel Aviv
        latitude:
          type: number
          example: 32.0853
        longitude:
          type: number
          example: 34.7818
    ScheduleEntry:
      type: object
      description: |
        One weekday of the work schedule. A day off has no times (start, end and flexHours may be
        omitted or null in a request; they are absent in responses). On a working day start and end
        are whole hours (HH:00), end is after start (no block crosses midnight), and flexHours is a
        whole number from 0 to 3 (defaults to 0). Times are Asia/Jerusalem.
      required: [day, dayOff]
      properties:
        day:
          type: string
          enum: [SUN, MON, TUE, WED, THU, FRI, SAT]
        dayOff:
          type: boolean
        start:
          nullable: true
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "08:00"
        end:
          nullable: true
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "18:00"
        flexHours:
          nullable: true
          type: integer
          minimum: 0
          maximum: 3
    Beach:
      type: object
      required: [id, name, latitude, longitude, facingDegrees]
      properties:
        id:
          type: string
          description: MongoDB ObjectId as a 24-character hex string
        name:
          type: string
          example: Gordon Beach
        latitude:
          type: number
          example: 32.0817
        longitude:
          type: number
          example: 34.7677
        facingDegrees:
          type: number
          minimum: 0
          maximum: 360
          description: Compass bearing the beach faces seaward; used to judge wind direction
          example: 270
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
